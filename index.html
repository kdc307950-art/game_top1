<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- AGENTS.md 5.1：禁止滚动与缩放，适配刘海屏 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#12101c" />
    <link rel="icon" href="data:," />
    <title>消消乐</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vine-map.css" />
  </head>
  <body>
    <!-- 只放结构：AGENTS.md 2.3。棋盘绘制全部在 app.js -->
    <canvas id="board" width="0" height="0"></canvas>

    <!-- Step 15/16（v1.20 / v1.22）画布外的控件区；Step 21.2（v1.32 / D048）改版为
         「糖果质感道具键 + 右上角红色计数徽章」，并把音效/震动收进**设置齿轮的浮层**。
         关键约束：**#controls 的高度仍是 --booster-bar-h（100px）**，齿轮与设置浮层都是绝对定位的
         浮层、不占布局 —— render.js 从可用高度里扣掉的就是这一个值（它决定 computeBoardSize/boardRect）。
         图标一律是**内联 SVG**（零素材 D009：不引入任何图片文件）。 -->
    <div id="controls">
      <div id="boosters" role="group" aria-label="道具">
        <!-- P1 修复（用户 2026-09-26 评审）：标签一律**两个字**，三个键等宽、单行显示。
             `aria-label` 保留完整名称（无障碍读出来仍是「加五步 / 小木锤」）。 -->
        <button class="booster" type="button" data-kind="refresh" aria-label="刷新">
          <span class="booster-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8" fill="none"/><path d="M20 4.5V9h-4.5" fill="none"/></svg>
          </span>
          <span class="booster-label">刷新</span>
          <span class="booster-count">0</span>
        </button>
        <button class="booster" type="button" data-kind="addSteps" aria-label="加五步">
          <span class="booster-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 4h4v5.5c2.9.4 5 2.6 5 5.5v4H7z"/></svg>
          </span>
          <span class="booster-label">加步</span>
          <span class="booster-count">0</span>
        </button>
        <button class="booster" type="button" data-kind="hammer" aria-label="小木锤">
          <span class="booster-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M13.5 3.5 20 10l-2.2 2.2-6.5-6.5z"/><path d="m11.2 9.2 3.6 3.6-6.4 6.4-3.6-3.6z"/></svg>
          </span>
          <span class="booster-label">木锤</span>
          <span class="booster-count">0</span>
        </button>
      </div>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings" aria-label="设置">⚙</button>
    </div>
    <div id="settings" role="group" aria-label="音效与震动" hidden>
      <button class="pref" type="button" data-pref="sound" aria-pressed="true">音效</button>
      <button class="pref" type="button" data-pref="haptic" aria-pressed="true">震动</button>
    </div>

    <!-- Step 19.2（v1.23）藤蔓关卡地图：结构容器在此，SVG 由 vine-map.js 画进这里、事件由 app.js 委托。
         它是**画布外的绝对定位层**，替换了原来画在 canvas 上的 10×5 选关网格。 -->
    <div id="map" hidden></div>

    <!-- 本项目源码为 ES Module，必须经 http(s) 打开，见 ROADMAP.md 第 0.9 条 -->
    <script type="module" src="app.js"></script>
  </body>
</html>
